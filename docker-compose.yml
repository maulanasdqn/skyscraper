services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skyscraper
      POSTGRES_USER: skyscraper
      POSTGRES_PASSWORD: skyscraper
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skyscraper"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  cosmium:
    image: cosmium:cpu
    cap_add:
      - SYS_ADMIN
    ports:
      - "3000:3000"
    volumes:
      - ./cosmium/profiles:/profiles:ro
    environment:
      COSMIUM_PROFILE_NAME: ${COSMIUM_PROFILE:-win11_rtx3060_en-us}
      RUST_LOG: ${COSMIUM_LOG:-info}
    restart: unless-stopped

  parallax:
    build:
      context: parallax
    ports:
      - "1080:1080"
      - "3001:3001"
    environment:
      PROXY_LISTEN: "0.0.0.0:1080"
      PROXY_USER: ${PROXY_USER:-}
      PROXY_PASS: ${PROXY_PASS:-dev_secret}
      ROUTES: ${ROUTES:-}
      RUST_LOG: ${PARALLAX_LOG:-info}
    restart: unless-stopped

  skyscraper-api:
    build:
      context: .
      dockerfile: skyscraper-api/Dockerfile
    ports:
      - "3002:3002"
    environment:
      DATABASE_URL: postgres://skyscraper:skyscraper@postgres:5432/skyscraper
      REDIS_URL: redis://redis:6379
      API_LISTEN: "0.0.0.0:3002"
      API_ADMIN_KEY: ${API_ADMIN_KEY:-sk_admin_dev}
      PROXY_PASS: ${PROXY_PASS:-dev_secret}
      PARALLAX_URL: http://parallax:3001
      PARALLAX_PROXY_HOST: parallax
      PARALLAX_PROXY_PORT: "1080"
      COSMIUM_URL: http://cosmium:3000
      CACHE_TTL_SECS: ${CACHE_TTL_SECS:-300}
      RUST_LOG: skyscraper=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cosmium:
        condition: service_started
      parallax:
        condition: service_started
    restart: unless-stopped

  skyscraper-worker:
    build:
      context: .
      dockerfile: skyscraper-worker/Dockerfile
    environment:
      DATABASE_URL: postgres://skyscraper:skyscraper@postgres:5432/skyscraper
      REDIS_URL: redis://redis:6379
      PROXY_PASS: ${PROXY_PASS:-dev_secret}
      PARALLAX_URL: http://parallax:3001
      PARALLAX_PROXY_HOST: parallax
      PARALLAX_PROXY_PORT: "1080"
      COSMIUM_URL: http://cosmium:3000
      COSMIUM_API_KEY: ${COSMIUM_API_KEY:-}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
      CACHE_TTL_SECS: ${CACHE_TTL_SECS:-300}
      DOMAIN_MAX_RPM: ${DOMAIN_MAX_RPM:-120}
      RUST_LOG: skyscraper=info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cosmium:
        condition: service_started
      parallax:
        condition: service_started
    restart: unless-stopped

  skyscraper-ui:
    build:
      context: skyscraper-ui
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - skyscraper-api
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
