server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://skyscraper-api:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /cosmium/ {
        rewrite ^/cosmium(/.*)$ /api$1 break;
        proxy_pass http://cosmium:3000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }

    location /parallax/ {
        rewrite ^/parallax(/.*)$ /api$1 break;
        proxy_pass http://parallax:3001;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
}
